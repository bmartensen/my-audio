<!DOCTYPE html>
<html lang="{{ page.lang | default: 'de' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ page.home | default: '/' | relative_url }}">
      <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="32" height="32"> My Audio
    </a>
    <nav>
      {% for link in page.nav %}<a href="{{ link.url | relative_url }}">{{ link.title }}</a>{% endfor %}
      <a href="{{ site.repository_url }}">GitHub</a>
      {% if page.other_lang %}<a class="lang" href="{{ page.other_lang | relative_url }}" hreflang="{{ page.other_lang_code }}">{{ page.other_lang_code | upcase }}</a>{% endif %}
    </nav>
  </header>
  <main class="content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>
      My Audio · <a href="{{ site.repository_url }}">{{ site.repository_url | remove: 'https://' }}</a> ·
      <a href="{{ site.repository_url }}/blob/main/LICENSE">MIT</a> ·
      <a href="https://www.martensening.com/myaudio/">martensening.com</a>
    </p>
  </footer>
</body>
</html>
