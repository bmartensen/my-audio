# GitHub Pages site of My Audio: info, downloads, user guide, privacy policy and legal notice in German
# (/de/…) and English (/en/…) with identical slugs; / chooses by browser language.
# Publish with Settings → Pages → Deploy from a branch → <branch> /docs.
title: My Audio
description: Mehrspur-Recorder für Musikdemos · Multitrack recorder for music demos
repository_url: https://github.com/bmartensen/my-audio
# Current app/guide version. A tag alone does not provide downloadable installers.
release: 0.10.3
released: 2026-11-23
# Enable direct GitHub downloads only after tools/check_site_downloads.ps1 -RequireGitHubRelease passes.
# Otherwise the landing pages link the repository's releases page without claiming a version.
release_downloads: true
markdown: kramdown
kramdown:
  auto_ids: true
